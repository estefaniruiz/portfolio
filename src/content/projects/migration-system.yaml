# Case study: Integrated Migration Management System
# Figma: "Case study v2 (Migration System)" (2442:1659)
# Text supports **bold** and *italic*. A blank line starts a new paragraph.
# Images live in /public/assets/projects/migration-system/

seo:
  title: Transforming Migration Systems — Estefani Ruiz
  description: How I led UX/UI for El Salvador's new migration system, used daily by officers processing 86 million crossings a year.

