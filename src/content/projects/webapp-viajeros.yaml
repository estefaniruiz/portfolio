# Case study: Traveler's Pre-Check WebApp (WebApp Viajeros)
# Figma: "Case study v2 (WebApp Viajeros)" (2531:2150)
# Text supports **bold** and *italic*. A blank line starts a new paragraph.
# Images live in /public/assets/projects/webapp-viajeros/

seo:
  title: Traveler's Pre-Check WebApp — Estefani Ruiz
  description: How I designed a web app that lets travelers pre-check their entry to El Salvador before they ever reach the border.

hero:
  kicker: "Migration made easy:"
  title: Traveler's Pre-Check WebApp
  facts:
    - { icon: "👤", label: "Client:", value: "El Salvador's Ministry of Justice" }
    - { icon: "⚡", label: "Design Team:", value: "Estefani Ruiz (Lead UX)" }
    - { icon: "⚒️", label: "Tools:", value: "Figma, Jira, Miro" }
